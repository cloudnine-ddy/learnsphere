pages:
  stage: deploy
  tags:
    - FIT2101
  cache:
    paths:
      - node_modules/
  script:
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -   # ✅ 安装 Node.js 源
    - apt-get install -y nodejs                                  # ✅ 安装 node + npm
    - npm ci
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    - courseFrontEnd

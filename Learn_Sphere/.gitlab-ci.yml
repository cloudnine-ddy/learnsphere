# .gitlab-ci.yml
pages:
  stage: deploy
  tags:
    - FIT2101
  cache:
    paths:
      - node_modules/
  script:
    # ✅ 第一步：安装 Node.js 和 npm（Shell Runner 必须手动装）
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs

    # ✅ 第二步：安装依赖 & 构建
    - npm ci
    - npm run build

    # ✅ 第三步：准备 GitLab Pages 目录
    - mv dist public

  artifacts:
    paths:
      - public
  only:
    - courseFrontEnd

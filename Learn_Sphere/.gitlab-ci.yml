# .gitlab-ci.yml
pages:
  stage: deploy
  tags:
    - FIT2101
  cache:
    paths:
      - node_modules/
  script:
    # ✅ 第一步：安装 Node.js + npm（因为 Shell Runner 没有自带）
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get update && apt-get install -y nodejs

    # ✅ 第二步：安装依赖 & 构建
    - npm install
    - npm run build

    # ✅ 第三步：移动构建结果到 public
    - mv dist public

  artifacts:
    paths:
      - public
  only:
    - courseFrontEnd

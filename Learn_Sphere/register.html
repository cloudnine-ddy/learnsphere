<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LearnSphere - Register</title>
        <link rel="stylesheet" href="CSS/register.css">
    </head>

    <body>

        <div class="main-content">
            <header class="header">
                <span>LearnSphere</span>
            </header>

            <div class="page-content">

                <div class="info-section">
                    <div class="info-header">
                        <h1 class="info-title">Sign Up</h1>
                    </div>
                    
                   
                    <div class="info-scroll">
                        <div class="form-row">
                            <label for="username">Username</label>
                            <div class="input-field">
                                <input class="input" name="username" id="username" type="text" required>
                            </div>
                            
                        </div>

                        <div class="form-row">
                            <label for="password">Password</label>
                            <div class="input-field">
                                <input class="input" name="password" id="password" type="password" required>
                                <button type="button" class="side-button" onclick="togglePassword('password', this)">
                                    <img src="images/icons/hide.png" alt="hide" class="icon">
                                </button>
                            </div>
                            
                        </div>

                        <div class="form-row">
                            <label for="confirmPassword">Confirm Password</label>
                            <div class="input-field">
                                <input class="input" name="confirmPassword" id="confirmPassword" type="password" required>
                                <button type="button" class="side-button" onclick="togglePassword('confirmPassword', this)">
                                    <img src="images/icons/hide.png" alt="hide" class="icon">
                                </button>
                            </div> 
                        </div>

                        <div class="form-row">
                            <label for="username">Username</label>
                            <div class="input-field">
                                <input class="input" name="username" id="username" type="text" required>
                            </div>
                            
                        </div>

                        <div class="form-row">
                            <label for="password">Password</label>
                            <div class="input-field">
                                <input class="input" name="password" id="password" type="password" required>
                                <button type="button" class="side-button" onclick="togglePassword('password', this)">
                                    <img src="images/icons/hide.png" alt="hide" class="icon">
                                </button>
                            </div>
                            
                        </div>

                        <div class="form-row">
                            <label for="confirmPassword">Confirm Password</label>
                            <div class="input-field">
                                <input class="input" name="confirmPassword" id="confirmPassword" type="password" required>
                                <button type="button" class="side-button" onclick="togglePassword('confirmPassword', this)">
                                    <img src="images/icons/hide.png" alt="hide" class="icon">
                                </button>
                            </div> 
                        </div>

                        <script>
                            function togglePassword(id, button) {
                                let input = document.getElementById(id);
                                let icon = button.querySelector('img');

                                if (input.type === 'password') {
                                    input.type = 'text';
                                    icon.src = "images/icons/show.png";
                                    icon.alt = 'show';
                                } else {
                                    input.type = 'password';
                                    icon.src = "images/icons/hide.png";
                                    icon.alt = 'hide';
                                }
                            }
                        </script>


                    </div>

                    <div class="info-footer">
                        <div class="term-row">
                            <input type="checkbox" id="agree" required>
                            <label for="agree">
                                I agree to the <a href="#">Terms and Privacy Policy</a>
                            </label>
                        </div>
                        
                        <button class="register-btn" type="submit">Register</button>

                        <p>
                            Have an account? <a href="#" style="color: white; text-decoration: none;">Login Here</a>
                        </p>
                    </div>

                </div>
                
            </div>
        </div>

    </body>


</html>

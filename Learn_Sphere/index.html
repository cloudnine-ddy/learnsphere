<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LearnSphere - Lessons</title>
        <link rel="stylesheet" href="CSS/style.css">
    </head>

    <body>
        <div class="sidebar">
            <div class="sidebar-top">
                <h2>LearnSphere</h2>
            </div>

            <div class="sidebar-menu">
                
                <h3 class="menu-item active">
                    <img src="images/icons/course.png" class="menu-icon">
                    Courses
                </h3>

                <h3 class="menu-item">
                    <img src="images/icons/lesson.png" class="menu-icon">
                    Lessons
                </h3>

                <h3 class="menu-item">
                    <img src="images/icons/classroom.png" class="menu-icon">
                    Classroom
                </h3>

                <h3 class="menu-item">
                    <img src="images/icons/view_report.png" class="menu-icon">
                    View Report
                </h3>

            </div>

            <div class="sidebar-bottom">
                <h3 class="menu-item" style="opacity: 0.5;">
                    <img src="images/icons/logout.png" class="menu-icon">
                    Logout
                </h3>
            </div>
        </div>

        <div class="main-content">
            <header class="header">
                <span>Username</span>
                <img src="images\icons\user.png" class="user-icon">
            </header>

            <div class="page-content">

                <div class="info-section">
                    <div class="info-header">
                        <h1 class="info-title">My Lessons</h1>
                        
                        <div class="dropdown">
                            <button class="dropdown-button">
                                All Lessons ▼
                            </button>
                            <div class="dropdown-content">
                                <a href="#">All Lessons</a>
                                <a href="#">My Lessons</a>
                            </div>
                        </div>
                    </div>
                    
                   
                    <div class="info-scroll">
                        <div class="lesson-container">
                            <div class="lesson-card">
                                <div class="lesson-icon">
                                    <img src="images/icons/atom.png" alt="">
                                </div>
                                <div class="lesson-info">
                                    <p class="lesson-id">
                                       SEL 001 
                                    </p>
                                    <h3 class="lesson-title">
                                        Software Engineering
                                    </h3>
                                </div>
                            </div>

                            <div class="lesson-card">
                                <div class="lesson-icon">
                                    <img src="images/icons/atom.png" alt="">
                                </div>
                                <div class="lesson-info">
                                    <p class="lesson-id">
                                       SEL 001 
                                    </p>
                                    <h3 class="lesson-title">
                                        Software Engineering
                                    </h3>
                                </div>
                            </div>

                            <div class="lesson-card">
                                <div class="lesson-icon">
                                    <img src="images/icons/atom.png" alt="">
                                </div>
                                <div class="lesson-info">
                                    <p class="lesson-id">
                                       SEL 001 
                                    </p>
                                    <h3 class="lesson-title">
                                        Software Engineering
                                    </h3>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                
            </div>
        </div>

    </body>


</html>

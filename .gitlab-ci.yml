# .gitlab-ci.yml
image: node:20

stages:
  - deploy

pages:
  stage: deploy
  tags:
    - FIT2101
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "courseFrontEnd"'

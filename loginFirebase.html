<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page </title>

    <!-- Firebase SDKs for Modular v9+ -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.4.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, deleteUser } from "https://www.gstatic.com/firebasejs/9.4.0/firebase-auth.js";
      import { getFirestore, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.4.0/firebase-firestore.js";

      // Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyBkQNEyRcMLYQ6tgUni9hh9JN1evZpo0iM",
        authDomain: "weshowagile.firebaseapp.com",
        projectId: "weshowagile",
        storageBucket: "weshowagile.firebasestorage.app",
        messagingSenderId: "324942220550",
        appId: "1:324942220550:web:779f62ae8323962e4fe287",
        measurementId: "G-9B5LVZ9MST"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // Get HTML elements
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");

      const submitButton = document.getElementById("logIn");
      const deleteButton = document.getElementById("delete"); // New delete button

      // Handle form submission
      submitButton.addEventListener('click', (event) => {
        event.preventDefault(); // Prevent form submission from reloading the page

        const email = emailInput.value;
        const password = passwordInput.value;

        console.log("Form submitted. Email: ", email, " Password: ", password); // Debugging log

        // Sign in user using Firebase Authentication
        signInWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
            const user = userCredential.user; // This is the authenticated user
            console.log("User signed in:", user); // Debugging log
            window.location.href="loggedIn.html";
          })
          .catch((error) => {
            const errorCode = error.code;
            const errorMessage = error.message;
            console.error("Error signing in user:", errorCode, errorMessage); // Debugging log
          });
      });

    </script>

</head>
<body>
    <form>
        <div id="signUpMessage" class="messageDiv" style="display:none;"></div>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"><br>

    </form>

    <button id="logIn">Login</button>

</body>
</html>

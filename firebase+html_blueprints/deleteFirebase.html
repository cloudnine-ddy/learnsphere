<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Delete</title>

    <!-- Firebase SDKs for Modular v9+ -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.4.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, deleteUser } from "https://www.gstatic.com/firebasejs/9.4.0/firebase-auth.js";
      import { getFirestore, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.4.0/firebase-firestore.js";

      // Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyBkQNEyRcMLYQ6tgUni9hh9JN1evZpo0iM",
        authDomain: "weshowagile.firebaseapp.com",
        projectId: "weshowagile",
        storageBucket: "weshowagile.firebasestorage.app",
        messagingSenderId: "324942220550",
        appId: "1:324942220550:web:779f62ae8323962e4fe287",
        measurementId: "G-9B5LVZ9MST"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // Get HTML elements
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");

      const deleteButton = document.getElementById("delete"); // New delete button

      // Handle form submission
      

      // Handle user deletion
      deleteButton.addEventListener('click', (event) => {
        event.preventDefault(); // Prevent form submission from reloading the page

        const user = auth.currentUser; // Get the current authenticated user

        if (user) {
          // Delete user data from Firestore
          const docRef = doc(db, "users", user.uid);
          deleteDoc(docRef)
            .then(() => {
              console.log("User data successfully deleted from Firestore!");
              
              // Now delete the user account
              deleteUser(user)
                .then(() => {
                  console.log("User account successfully deleted!");
                  window.location.href = 'index.html'; // Redirect after account deletion
                })
                .catch((error) => {
                  console.error("Error deleting user account:", error);
                });
            })
            .catch((error) => {
              console.error("Error deleting user data from Firestore:", error);
            });
        } else {
          console.log("No user is signed in.");
        }
      });

    </script>

</head>
<body>
    <form>
        <div id="signUpMessage" class="messageDiv" style="display:none;"></div>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"><br>

    </form>
    <button id="delete">Delete Account</button> <br> <!-- Button to delete user account -->

</body>

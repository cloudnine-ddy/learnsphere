<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Lesson</title>

    <!-- Firebase SDKs for Modular v9+ -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.4.0/firebase-app.js";
      import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.4.0/firebase-firestore.js";

      // Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyBkQNEyRcMLYQ6tgUni9hh9JN1evZpo0iM",
        authDomain: "weshowagile.firebaseapp.com",
        projectId: "weshowagile",
        storageBucket: "weshowagile.firebasestorage.app",
        messagingSenderId: "324942220550",
        appId: "1:324942220550:web:779f62ae8323962e4fe287",
        measurementId: "G-9B5LVZ9MST"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Form submission handler
      document.getElementById("lessonForm").addEventListener("submit", async function(event) {
        event.preventDefault(); // Prevent default form submission

        // Lesson data to save to Firestore
        const lessonData = {
          lessonID: document.getElementById("lessonID").value,
          title: document.getElementById("lessonTitle").value,
          description: document.getElementById("lessonDescription").value,
          readingList: document.getElementById("readingList").value.split(",").map(s => s.trim()).filter(Boolean),
          prerequisites: document.getElementById("prerequisites").value.split(",").map(s => s.trim()).filter(Boolean),
          assignments: document.getElementById("assignments").value.split(",").map(s => s.trim()).filter(Boolean),
          status: document.getElementById("status").value,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        };

        try {
          // Save lesson data to Firestore
          const docRef = doc(db, "lessons", new Date().getTime().toString());  // Unique document ID based on timestamp
          await setDoc(docRef, lessonData);

          console.log("Lesson created successfully:", lessonData);

          // Redirect to another page after success
          window.location.href = 'placeholderHomepage.html';
        } catch (error) {
          console.error("Error creating lesson:", error);
        }
      });
    </script>
</head>
<body>
    <form id="lessonForm">
        <!-- Lesson Form -->

        <label>Lesson ID:</label>
        <input type="text" id="lessonID" name="title" required><br><br>

        <label>Lesson Title:</label>
        <input type="text" id="lessonTitle" name="title" required><br><br>

        <label>Lesson Description:</label><br>
        <textarea id="lessonDescription" name="description" required></textarea><br><br>

        <label>Reading List (comma-separated URLs):</label><br>
        <input type="text" id="readingList" name="readingList"><br><br>

        <label>Prerequisite Lesson IDs (comma-separated):</label><br>
        <input type="text" id="prerequisites" name="prerequisites"><br><br>

        <label>Assignments (comma-separated IDs):</label><br>
        <input type="text" id="assignments" name="assignments"><br><br>

        <label>Status:</label>
        <select id="status" name="status">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select><br><br>

        <button type="submit">Create Lesson</button>
    </form>
</body> 
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Classroom</title>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.4.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.4.0/firebase-firestore.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBkQNEyRcMLYQ6tgUni9hh9JN1evZpo0iM",
      authDomain: "weshowagile.firebaseapp.com",
      projectId: "weshowagile",
      storageBucket: "weshowagile.firebasestorage.app",
      messagingSenderId: "324942220550",
      appId: "1:324942220550:web:779f62ae8323962e4fe287",
      measurementId: "G-9B5LVZ9MST"
    };

    // Init Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Form handler
    document.getElementById("classroomForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const classroomData = {
        classroom_id: document.getElementById("classroomID").value,
        classroom_course: document.getElementById("courseID").value,
        classroom_instructor: document.getElementById("instructorID").value,
        classroom_name: document.getElementById("classroomName").value,
        classroom_description: document.getElementById("classroomDescription").value,
        classroom_lessons: document.getElementById("classroomLessons").value.split(",").map(s => s.trim()).filter(Boolean),
        classroom_students: document.getElementById("classroomStudents").value.split(",").map(s => s.trim()).filter(Boolean),
        classroom_startDate: document.getElementById("classroomStartDate").value,
        classroom_status: document.getElementById("classroomStatus").value,
        classroom_createdDate: new Date().toISOString(),
        classroom_updatedDate: new Date().toISOString(),
      };

      try {
        const docRef = doc(db, "classrooms", new Date().getTime().toString());
        await setDoc(docRef, classroomData);
        console.log("Classroom created:", classroomData);

        // redirect after success
        window.location.href = 'index.html';
      } catch (error) {
        console.error("Error creating classroom:", error);
      }
    });
  </script>
</head>

<body>
  <form id="classroomForm">
    <h1>Create Classroom</h1>

    <label>Classroom ID:</label><br>
    <input type="text" id="classroomID" required><br><br>

    <label>Course ID (or name):</label><br>
    <input type="text" id="courseID" required><br><br>

    <label>Instructor (ID or Name):</label><br>
    <input type="text" id="instructorID" required><br><br>

    <label>Classroom Name:</label><br>
    <input type="text" id="classroomName" required><br><br>

    <label>Classroom Description:</label><br>
    <textarea id="classroomDescription" required></textarea><br><br>

    <label>Lessons (comma-separated):</label><br>
    <input type="text" id="classroomLessons"><br><br>

    <label>Students (comma-separated IDs/emails):</label><br>
    <input type="text" id="classroomStudents"><br><br>

    <label>Start Date:</label><br>
    <input type="date" id="classroomStartDate"><br><br>

    <label>Status:</label><br>
    <select id="classroomStatus">
      <option value="draft">Draft</option>
      <option value="active">Active</option>
      <option value="archived">Archived</option>
    </select><br><br>

    <button type="submit">Create Classroom</button>
  </form>
</body>

</html>
